# Example version-one credential store.
#
# Intentionally empty: this shipped sample carries no credentials, no token
# values, and no credential IDs. `auth.yaml` holds only structural metadata
# (see ../configuration.md); the real tokens never cross the native auth
# boundary. Populate credentials only through the auth CLI/host flows and
# never commit real secrets here. Mode 0600 in every deployment.
version: 1
credentials: {}
