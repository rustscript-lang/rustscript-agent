{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://schemas.rustscript.local/v1/managed-effect.schema.yaml",
  "title": "Managed effect audit records; identifiers grant no authority",
  "oneOf": [
    {
      "$ref": "#/$defs/record"
    },
    {
      "$ref": "#/$defs/prepared"
    }
  ],
  "$defs": {
    "owner": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "profile",
        "session_id",
        "run_id"
      ],
      "properties": {
        "profile": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "session_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        }
      }
    },
    "directory_identity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "device_decimal",
        "inode_decimal"
      ],
      "properties": {
        "device_decimal": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "inode_decimal": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        }
      }
    },
    "workspace_identity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "store_id",
        "workspace_id",
        "branch_id",
        "source_identity"
      ],
      "properties": {
        "store_id": {
          "type": "string",
          "pattern": "^store-[0-9a-f]{32}$"
        },
        "workspace_id": {
          "type": "string",
          "pattern": "^ws-[0-9a-f]{32}$"
        },
        "branch_id": {
          "type": "string",
          "pattern": "^br-[0-9a-f]{32}$"
        },
        "source_identity": {
          "$ref": "#/$defs/directory_identity"
        }
      }
    },
    "object": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "store_id",
        "object_id",
        "object_kind",
        "byte_count",
        "entry_count",
        "object_format"
      ],
      "properties": {
        "store_id": {
          "type": "string",
          "pattern": "^store-[0-9a-f]{32}$"
        },
        "object_id": {
          "type": "string",
          "pattern": "^(tree|result|intent)-[0-9a-f]{32}$"
        },
        "object_kind": {
          "enum": [
            "tree",
            "canonical_result",
            "intent_details"
          ]
        },
        "byte_count": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "entry_count": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,19})$"
        },
        "object_format": {
          "enum": [
            "agent.managed-tree/v1",
            "agent.canonical-tool-result/v1",
            "agent.intent-details/v1"
          ]
        }
      }
    },
    "code": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "graph_id",
        "activation_generation",
        "graph_ref_id",
        "package_id",
        "artifact_id",
        "export",
        "registry_identity",
        "effect_contract_version"
      ],
      "properties": {
        "graph_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "activation_generation": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9007199254740991
        },
        "graph_ref_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "package_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "artifact_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "export": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "registry_identity": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "effect_contract_version": {
          "const": 1
        }
      }
    },
    "arguments": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "canonical_arguments"
          ],
          "properties": {
            "kind": {
              "const": "inline"
            },
            "canonical_arguments": {
              "type": "string",
              "minLength": 1,
              "maxLength": 1048576
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "details"
          ],
          "properties": {
            "kind": {
              "const": "object"
            },
            "details": {
              "$ref": "#/$defs/object"
            }
          }
        }
      ]
    },
    "identity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "owner",
        "call_id",
        "tool_name",
        "argument_identity",
        "code",
        "workspace",
        "epoch",
        "expected_head",
        "expected_head_version",
        "original_deadline_ms",
        "authorization_generation",
        "approved_risk",
        "approval_basis"
      ],
      "properties": {
        "owner": {
          "$ref": "#/$defs/owner"
        },
        "call_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "tool_name": {
          "enum": [
            "read_file",
            "search_files",
            "write_file",
            "patch",
            "terminal"
          ]
        },
        "argument_identity": {
          "$ref": "#/$defs/arguments"
        },
        "code": {
          "$ref": "#/$defs/code"
        },
        "workspace": {
          "$ref": "#/$defs/workspace_identity"
        },
        "epoch": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "expected_head": {
          "type": "string",
          "pattern": "^tree-[0-9a-f]{32}$"
        },
        "expected_head_version": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "original_deadline_ms": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "authorization_generation": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "approved_risk": {
          "enum": [
            "read",
            "write",
            "execute"
          ]
        },
        "approval_basis": {
          "enum": [
            "read_without_attestation",
            "guardian_attested"
          ]
        }
      }
    },
    "prepared": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "format",
        "schemaVersion",
        "effect_id",
        "identity",
        "parent_root",
        "candidate_root",
        "canonical_result",
        "conflict_result",
        "writer_state",
        "operation_class",
        "prepared_at_ms",
        "observation_ok",
        "external_effects"
      ],
      "properties": {
        "format": {
          "const": "agent.managed-effect/v1"
        },
        "schemaVersion": {
          "const": 1
        },
        "effect_id": {
          "type": "string",
          "pattern": "^effect-[0-9a-f]{32}$"
        },
        "identity": {
          "$ref": "#/$defs/identity"
        },
        "parent_root": {
          "$ref": "#/$defs/object"
        },
        "candidate_root": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "$ref": "#/$defs/object"
            }
          ]
        },
        "canonical_result": {
          "$ref": "#/$defs/object"
        },
        "conflict_result": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "$ref": "#/$defs/object"
            }
          ]
        },
        "writer_state": {
          "enum": [
            "settled",
            "no_process"
          ]
        },
        "operation_class": {
          "enum": [
            "read_only",
            "tree_write"
          ]
        },
        "prepared_at_ms": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "observation_ok": {
          "type": "boolean"
        },
        "external_effects": {
          "enum": [
            "none_claimed",
            "outside_tree_not_reverted"
          ]
        }
      }
    },
    "publication": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "format",
        "effect_id",
        "workspace_id",
        "branch_id",
        "epoch",
        "base_head",
        "base_head_version",
        "candidate_head",
        "observed_head",
        "observed_head_version",
        "status"
      ],
      "properties": {
        "format": {
          "const": "agent.managed-effect/v1"
        },
        "effect_id": {
          "type": "string",
          "pattern": "^effect-[0-9a-f]{32}$"
        },
        "workspace_id": {
          "type": "string",
          "pattern": "^ws-[0-9a-f]{32}$"
        },
        "branch_id": {
          "type": "string",
          "pattern": "^br-[0-9a-f]{32}$"
        },
        "epoch": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "base_head": {
          "type": "string",
          "pattern": "^tree-[0-9a-f]{32}$"
        },
        "base_head_version": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "candidate_head": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "type": "string",
              "pattern": "^tree-[0-9a-f]{32}$"
            }
          ]
        },
        "observed_head": {
          "type": "string",
          "pattern": "^tree-[0-9a-f]{32}$"
        },
        "observed_head_version": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        },
        "status": {
          "enum": [
            "read_only",
            "committed",
            "staged",
            "conflict",
            "not_published",
            "indeterminate"
          ]
        }
      }
    },
    "event": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "event_id",
        "seq"
      ],
      "properties": {
        "event_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "seq": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        }
      }
    },
    "message": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "ordinal"
      ],
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "ordinal": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9007199254740991
        }
      }
    },
    "outcome": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "disposition",
        "publication",
        "canonical_result_ref",
        "output_event",
        "terminal_event",
        "message",
        "replayed"
      ],
      "properties": {
        "disposition": {
          "enum": [
            "read_only",
            "committed",
            "conflict",
            "not_published"
          ]
        },
        "publication": {
          "$ref": "#/$defs/publication"
        },
        "canonical_result_ref": {
          "$ref": "#/$defs/object"
        },
        "output_event": {
          "$ref": "#/$defs/event"
        },
        "terminal_event": {
          "$ref": "#/$defs/event"
        },
        "message": {
          "$ref": "#/$defs/message"
        },
        "replayed": {
          "type": "boolean"
        }
      }
    },
    "recovery": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "code",
        "publication",
        "canonical_failure_json",
        "output_event",
        "terminal_event",
        "message"
      ],
      "properties": {
        "code": {
          "enum": [
            "effect_staged",
            "effect_indeterminate"
          ]
        },
        "publication": {
          "$ref": "#/$defs/publication"
        },
        "canonical_failure_json": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "json"
          ],
          "properties": {
            "json": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            }
          }
        },
        "output_event": {
          "$ref": "#/$defs/event"
        },
        "terminal_event": {
          "$ref": "#/$defs/event"
        },
        "message": {
          "$ref": "#/$defs/message"
        }
      }
    },
    "record": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "format",
        "effect_id",
        "schemaVersion",
        "identity",
        "state",
        "prepared",
        "outcome",
        "recovery"
      ],
      "properties": {
        "format": {
          "const": "agent.managed-effect/v1"
        },
        "effect_id": {
          "type": "string",
          "pattern": "^effect-[0-9a-f]{32}$"
        },
        "schemaVersion": {
          "const": 1
        },
        "identity": {
          "$ref": "#/$defs/identity"
        },
        "state": {
          "enum": [
            "read_only",
            "committed",
            "staged",
            "conflict",
            "not_published",
            "indeterminate"
          ]
        },
        "prepared": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "$ref": "#/$defs/prepared"
            }
          ]
        },
        "outcome": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "$ref": "#/$defs/outcome"
            }
          ]
        },
        "recovery": {
          "anyOf": [
            {
              "type": "null"
            },
            {
              "$ref": "#/$defs/recovery"
            }
          ]
        }
      }
    }
  }
}
