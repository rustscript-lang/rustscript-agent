{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://schemas.rustscript.local/managed-checkpoint.schema.yaml",
  "title": "managed-checkpoint current typed contract",
  "oneOf": [
    {
      "$ref": "#/$defs/ManagedCheckpointCreateRequest"
    },
    {
      "$ref": "#/$defs/ManagedCheckpointReceipt"
    },
    {
      "$ref": "#/$defs/ManagedCheckpointCommitInput"
    },
    {
      "$ref": "#/$defs/ManagedCheckpointLookup"
    },
    {
      "$ref": "#/$defs/ManagedCheckpointContext"
    },
    {
      "$ref": "#/$defs/ManagedSavedCheckpointReceipt"
    },
    {
      "$ref": "#/$defs/ManagedPublishRequest"
    },
    {
      "$ref": "#/$defs/ManagedPublishReceipt"
    },
    {
      "$ref": "#/$defs/ManagedWorkspacePublication"
    }
  ],
  "$defs": {
    "CanonicalToolResultJson": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "json"
      ],
      "properties": {
        "json": {
          "type": "string",
          "maxLength": 1048576
        }
      }
    },
    "DirectoryIdentity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "device_decimal",
        "inode_decimal"
      ],
      "properties": {
        "device_decimal": {
          "type": "string",
          "maxLength": 256
        },
        "inode_decimal": {
          "type": "string",
          "maxLength": 256
        }
      }
    },
    "ManagedApprovalBasis": {
      "type": "string",
      "enum": [
        "read_without_attestation",
        "guardian_attested"
      ]
    },
    "ManagedArgumentIdentity": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "canonical_arguments"
          ],
          "properties": {
            "kind": {
              "const": "inline"
            },
            "canonical_arguments": {
              "type": "string",
              "maxLength": 256
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "details"
          ],
          "properties": {
            "kind": {
              "const": "object"
            },
            "details": {
              "$ref": "#/$defs/ManagedObjectRef"
            }
          }
        }
      ]
    },
    "ManagedCallIdentity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "owner",
        "call_id",
        "tool_name",
        "argument_identity",
        "code",
        "workspace",
        "epoch",
        "expected_head",
        "expected_head_version",
        "original_deadline_ms",
        "authorization_generation",
        "approved_risk",
        "approval_basis"
      ],
      "properties": {
        "owner": {
          "$ref": "#/$defs/ManagedOwnerScope"
        },
        "call_id": {
          "type": "string",
          "maxLength": 256
        },
        "tool_name": {
          "type": "string",
          "maxLength": 256
        },
        "argument_identity": {
          "$ref": "#/$defs/ManagedArgumentIdentity"
        },
        "code": {
          "$ref": "#/$defs/ManagedCodeIdentity"
        },
        "workspace": {
          "$ref": "#/$defs/ManagedWorkspaceIdentity"
        },
        "epoch": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9223372036854775807
        },
        "expected_head": {
          "type": "string",
          "maxLength": 256
        },
        "expected_head_version": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "original_deadline_ms": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "authorization_generation": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "approved_risk": {
          "type": "string",
          "maxLength": 256
        },
        "approval_basis": {
          "$ref": "#/$defs/ManagedApprovalBasis"
        }
      }
    },
    "ManagedCheckpointArtifactRef": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "artifact_id",
        "object"
      ],
      "properties": {
        "artifact_id": {
          "type": "string",
          "maxLength": 256
        },
        "object": {
          "$ref": "#/$defs/ManagedObjectRef"
        }
      }
    },
    "ManagedCheckpointCommitInput": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "request",
        "original_request_proof",
        "captured_source",
        "receipt",
        "messages",
        "execution_config",
        "compaction"
      ],
      "properties": {
        "request": {
          "$ref": "#/$defs/ManagedCheckpointCreateRequest"
        },
        "original_request_proof": {
          "type": "string",
          "maxLength": 1048576
        },
        "captured_source": {
          "$ref": "#/$defs/ManagedSourceCas"
        },
        "receipt": {
          "$ref": "#/$defs/ManagedCheckpointReceipt"
        },
        "messages": {
          "type": "array",
          "maxItems": 128,
          "items": {
            "$ref": "#/$defs/ManagedFrozenMessage"
          }
        },
        "compaction": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedFrozenCompaction"
            },
            {
              "type": "null"
            }
          ]
        },
        "execution_config": {
          "$ref": "#/$defs/ManagedFrozenExecutionConfig"
        }
      }
    },
    "ManagedCheckpointContext": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "workspace",
        "head",
        "session_id",
        "session_generation",
        "last_ordinal",
        "messages",
        "effects",
        "external",
        "unsettled_runs",
        "source_runs",
        "pending_compactions",
        "compaction"
      ],
      "properties": {
        "workspace": {
          "$ref": "#/$defs/ManagedWorkspaceRecord"
        },
        "head": {
          "$ref": "#/$defs/ManagedWorkspaceHead"
        },
        "session_id": {
          "type": "string",
          "maxLength": 256
        },
        "session_generation": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "last_ordinal": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "messages": {
          "type": "array",
          "maxItems": 129,
          "items": {
            "$ref": "#/$defs/ManagedFrozenMessage"
          }
        },
        "effects": {
          "type": "array",
          "maxItems": 129,
          "items": {
            "$ref": "#/$defs/ManagedEffectRecord"
          }
        },
        "external": {
          "type": "array",
          "maxItems": 33,
          "items": {
            "$ref": "#/$defs/ManagedExternalHighWater"
          }
        },
        "unsettled_runs": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "source_runs": {
          "type": "array",
          "maxItems": 129,
          "items": {
            "$ref": "#/$defs/ManagedSourceRunRef"
          }
        },
        "pending_compactions": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "compaction": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedFrozenCompaction"
            },
            {
              "type": "null"
            }
          ]
        }
      }
    },
    "ManagedCheckpointCreateRequest": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "source_run_id",
        "workspace_id",
        "source_branch_id",
        "expected_epoch",
        "request_id",
        "mode"
      ],
      "properties": {
        "source_run_id": {
          "type": "string",
          "maxLength": 256,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "workspace_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1
        },
        "source_branch_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1
        },
        "expected_epoch": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9223372036854775807
        },
        "request_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "mode": {
          "$ref": "#/$defs/ManagedCheckpointMode"
        }
      }
    },
    "ManagedCheckpointGraphRef": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "graph_id",
        "checkpoint_graph_ref_id",
        "captured_activation_generation",
        "package_id",
        "artifact_id",
        "export",
        "registry_identity",
        "effect_contract_version",
        "harness_selection"
      ],
      "properties": {
        "graph_id": {
          "type": "string",
          "maxLength": 256,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "checkpoint_graph_ref_id": {
          "type": "string",
          "maxLength": 256,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "captured_activation_generation": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "package_id": {
          "type": "string",
          "maxLength": 256
        },
        "artifact_id": {
          "type": "string",
          "maxLength": 256
        },
        "export": {
          "type": "string",
          "maxLength": 256
        },
        "registry_identity": {
          "type": "string",
          "maxLength": 256
        },
        "effect_contract_version": {
          "type": "integer",
          "minimum": 0,
          "maximum": 4294967295
        },
        "harness_selection": {
          "$ref": "https://schemas.rustscript.local/v1/plugin-graph-lock.schema.yaml#/properties/harness_selection"
        }
      }
    },
    "ManagedCheckpointLookup": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "checkpoint",
        "messages",
        "execution_config",
        "compaction"
      ],
      "properties": {
        "checkpoint": {
          "$ref": "#/$defs/ManagedCheckpointRef"
        },
        "messages": {
          "type": "array",
          "maxItems": 128,
          "items": {
            "$ref": "#/$defs/ManagedFrozenMessage"
          }
        },
        "compaction": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedFrozenCompaction"
            },
            {
              "type": "null"
            }
          ]
        },
        "execution_config": {
          "$ref": "#/$defs/ManagedFrozenExecutionConfig"
        }
      }
    },
    "ManagedCheckpointMode": {
      "type": "string",
      "enum": [
        "at_closed_batch"
      ]
    },
    "ManagedCheckpointPublicConfig": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "model",
        "registry_identity",
        "tool_schemas_ref",
        "policy_revision",
        "publication_policy"
      ],
      "properties": {
        "model": {
          "type": "string",
          "maxLength": 256
        },
        "provider": {
          "anyOf": [
            {
              "type": "string",
              "maxLength": 256
            },
            {
              "type": "null"
            }
          ]
        },
        "system_instructions": {
          "anyOf": [
            {
              "type": "string",
              "maxLength": 65536
            },
            {
              "type": "null"
            }
          ]
        },
        "registry_identity": {
          "type": "string",
          "maxLength": 256
        },
        "tool_schemas_ref": {
          "type": "string",
          "maxLength": 256
        },
        "policy_revision": {
          "type": "string",
          "maxLength": 256
        },
        "publication_policy": {
          "$ref": "#/$defs/ManagedCheckpointPublication"
        }
      }
    },
    "ManagedCheckpointPublication": {
      "type": "string",
      "enum": [
        "managed_only"
      ]
    },
    "ManagedCheckpointReceipt": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "request_id",
        "checkpoint",
        "committed_at_ms",
        "replayed"
      ],
      "properties": {
        "request_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "checkpoint": {
          "$ref": "#/$defs/ManagedCheckpointRef"
        },
        "committed_at_ms": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "replayed": {
          "type": "boolean"
        }
      }
    },
    "ManagedCheckpointRef": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "checkpoint_id",
        "workspace_id",
        "parent_run_id",
        "source_branch_id",
        "source_epoch",
        "frozen_root",
        "history",
        "graph",
        "public_config",
        "plugin_state",
        "external_boundary"
      ],
      "properties": {
        "checkpoint_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "workspace_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1
        },
        "parent_run_id": {
          "type": "string",
          "maxLength": 256,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        "source_branch_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1
        },
        "source_epoch": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9223372036854775807
        },
        "frozen_root": {
          "$ref": "#/$defs/ManagedObjectRef"
        },
        "history": {
          "$ref": "#/$defs/ManagedFrozenHistoryRef"
        },
        "graph": {
          "$ref": "#/$defs/ManagedCheckpointGraphRef"
        },
        "public_config": {
          "$ref": "#/$defs/ManagedPublicConfigRef"
        },
        "plugin_state": {
          "$ref": "#/$defs/ManagedCheckpointStateCoverage"
        },
        "external_boundary": {
          "$ref": "#/$defs/ManagedExternalBoundary"
        }
      }
    },
    "ManagedCheckpointStateCoverage": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "graph_id",
            "package_id",
            "artifact_id",
            "manifest_state_absent",
            "state_effects_absent",
            "roots"
          ],
          "properties": {
            "kind": {
              "const": "stateless_builtin"
            },
            "graph_id": {
              "type": "string",
              "maxLength": 256
            },
            "package_id": {
              "type": "string",
              "maxLength": 256
            },
            "artifact_id": {
              "type": "string",
              "maxLength": 256
            },
            "manifest_state_absent": {
              "const": true
            },
            "state_effects_absent": {
              "const": true
            },
            "roots": {
              "type": "array",
              "maxItems": 0,
              "items": {
                "$ref": "#/$defs/ManagedPluginStateRootRef"
              }
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "graph_id",
            "package_id",
            "artifact_id",
            "manifest_state_absent",
            "state_effects_absent",
            "roots",
            "policy",
            "policy_host_imports_absent"
          ],
          "properties": {
            "kind": {
              "const": "stateless_builtin_with_pure_policy"
            },
            "graph_id": {
              "type": "string",
              "maxLength": 256
            },
            "package_id": {
              "type": "string",
              "maxLength": 256
            },
            "artifact_id": {
              "type": "string",
              "maxLength": 256
            },
            "manifest_state_absent": {
              "const": true
            },
            "state_effects_absent": {
              "const": true
            },
            "roots": {
              "type": "array",
              "maxItems": 0,
              "items": {
                "$ref": "#/$defs/ManagedPluginStateRootRef"
              }
            },
            "policy": {
              "$ref": "https://schemas.rustscript.local/v1/plugin-graph-lock.schema.yaml#/properties/harness_selection/oneOf/2/properties/policy"
            },
            "policy_host_imports_absent": {
              "const": true
            }
          }
        }
      ]
    },
    "ManagedClosedOutputRef": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "run_id",
        "call_id",
        "parent_message_id",
        "output_message_id",
        "receipt_id",
        "result"
      ],
      "properties": {
        "run_id": {
          "type": "string",
          "maxLength": 256
        },
        "call_id": {
          "type": "string",
          "maxLength": 256
        },
        "parent_message_id": {
          "type": "string",
          "maxLength": 256
        },
        "output_message_id": {
          "type": "string",
          "maxLength": 256
        },
        "receipt_id": {
          "type": "string",
          "maxLength": 256,
          "minLength": 1
        },
        "result": {
          "$ref": "#/$defs/ManagedObjectRef"
        }
      }
    },
    "ManagedCodeIdentity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "graph_id",
        "activation_generation",
        "graph_ref_id",
        "package_id",
        "artifact_id",
        "export",
        "registry_identity",
        "effect_contract_version"
      ],
      "properties": {
        "graph_id": {
          "type": "string",
          "maxLength": 256
        },
        "activation_generation": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        },
        "graph_ref_id": {
          "type": "string",
          "maxLength": 256
        },
        "package_id": {
          "type": "string",
          "maxLength": 256
        },
        "artifact_id": {
          "type": "string",
          "maxLength": 256
        },
        "export": {
          "type": "string",
          "maxLength": 256
        },
        "registry_identity": {
          "type": "string",
          "maxLength": 256
        },
        "effect_contract_version": {
          "type": "integer",
          "minimum": 0,
          "maximum": 4294967295
        }
      }
    },
    "ManagedCommitOutcome": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "disposition",
        "publication",
        "canonical_result_ref",
        "output_event",
        "terminal_event",
        "message",
        "replayed"
      ],
      "properties": {
        "disposition": {
          "$ref": "#/$defs/ManagedPublicationStatus"
        },
        "publication": {
          "$ref": "#/$defs/ManagedPublicationRef"
        },
        "canonical_result_ref": {
          "$ref": "#/$defs/ManagedObjectRef"
        },
        "output_event": {
          "$ref": "#/$defs/ManagedEventRef"
        },
        "terminal_event": {
          "$ref": "#/$defs/ManagedEventRef"
        },
        "message": {
          "$ref": "#/$defs/ManagedMessageRef"
        },
        "replayed": {
          "type": "boolean"
        }
      }
    },
    "ManagedEffectRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "format",
        "effect_id",
        "schemaVersion",
        "identity",
        "state"
      ],
      "properties": {
        "format": {
          "type": "string",
          "maxLength": 256
        },
        "effect_id": {
          "type": "string",
          "maxLength": 256
        },
        "schemaVersion": {
          "type": "integer",
          "minimum": 0,
          "maximum": 4294967295
        },
        "identity": {
          "$ref": "#/$defs/ManagedCallIdentity"
        },
        "state": {
          "$ref": "#/$defs/ManagedPublicationStatus"
        },
        "prepared": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedPreparedRecord"
            },
            {
              "type": "null"
            }
          ]
        },
        "outcome": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedCommitOutcome"
            },
            {
              "type": "null"
            }
          ]
        },
        "recovery": {
          "anyOf": [
            {
              "$ref": "#/$defs/ManagedRecoveryObservation"
            },
            {
              "type": "null"
            }
          ]
        }
      }
    },
    "ManagedEventRef": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "event_id",
        "seq"
      ],
      "properties": {
        "event_id": {
          "type": "string",
          "maxLength": 256
        },
        "seq": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9223372036854775807
        }
      }
    },
    "ManagedExternalBoundary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "high_water",
        "not_reverted",
        "artifact_refs"
      ],
      "properties": {
        "high_water": {
          "type": "array",
          "maxItems": 32,
          "items": {
            "$ref": "#/$defs/ManagedExternalHighWater"
          }
        },
        "not_reverted": {
          "type": "array",
          "maxItems": 32,
          "items": {
            "$ref": "#/$defs/ManagedExternalNotice"
          }
        },
        "artifact_refs": {
          "type": "array",
          "maxItems": 0,
          "items": {
            "$ref": "#/$defs/ManagedCheckpointArtifactRef"
          }
        }
      }
    },
    "ManagedExternalEffects": {
      "type": "string",
      "enum": [
        "none_claimed",
        "outside_tree_not_reverted"
      ]
    },
    "ManagedExternalHighWater": {
      "type": "object",
      "additionalProperties": false,
      "required": [
