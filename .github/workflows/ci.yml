name: CI

on:
  push:
    branches: [master]
  pull_request:

# Optional but recommended: cancel superseded runs on the same ref so a
# fresh push or PR update does not queue behind an outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The agent depends on pd-vm through the path dependency `../rustscript`,
  # and Cargo.lock in this repository is generated against exactly this core
  # revision. CI checks out the core at this revision so `--locked` builds
  # resolve. Bump this only together with a Cargo.lock refresh.
  RUSTSCRIPT_CORE_REF: 06b37fd155be2b81ba4b41dbb6514e7b283f4f10
  # Integration tests place temporary SQLite state here. The tests honor
  # this variable; without it they fall back to /mnt/TEMP/rustscript/...
  # which is the local-development default and not writable on CI runners.
  RUSTSCRIPT_AGENT_TEST_TMP: ${{ runner.temp }}/rustscript-agent-tests

jobs:
  quality:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rustscript-agent
        uses: actions/checkout@v4
        with:
          # The agent must live in a directory named `rustscript-agent`
          # relative to $GITHUB_WORKSPACE so the `path = "../rustscript"`
          # dependency in Cargo.toml resolves to the sibling core checkout
          # below. An explicit path keeps this independent of the default
          # workspace-root layout; every run step below uses
          # `working-directory: rustscript-agent` for the same reason.
          path: rustscript-agent

      - name: Checkout pinned RustScript core (path dependency)
        uses: actions/checkout@v4
        with:
          repository: rustscript-lang/rustscript
          # Sibling of the agent checkout, resolving `../rustscript`.
          path: rustscript
          ref: ${{ env.RUSTSCRIPT_CORE_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        working-directory: rustscript-agent
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        working-directory: rustscript-agent
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      # The default suite runs all non-ignored tests. #[ignore]d suites
      # (core repro driver and blocked provider parse/stream tests) stay
      # excluded until the core contract gate clears — see
      # plans/2026-08-13_a3-provider-core-blocker.md.
      - name: Test (workspace, all features, all targets)
        working-directory: rustscript-agent
        run: cargo test --locked --all-features --all-targets

      # `git diff --check` on a fresh checkout checks nothing (there is no
      # unstaged diff), so fail on real drift instead: every step above must
      # leave the working tree exactly as checked out. This catches tests
      # writing state into the checkout instead of $RUSTSCRIPT_AGENT_TEST_TMP
      # and generated files left dirty by a step.
      - name: Working tree must stay clean
        working-directory: rustscript-agent
        run: git diff --exit-code
