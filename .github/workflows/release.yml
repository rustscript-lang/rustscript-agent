name: Linux Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Linux x86_64 GNU release
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.99.1'
          target: x86_64-unknown-linux-gnu

      - name: Resolve tagged release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          NOTES=docs/releases/${VERSION}.md
          TITLE="rustscript-agent ${TAG}"
          ASSET="dist/rustscript-agent-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_HEAD" = "$RELEASE_COMMIT"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          test "$(printf '%s\n' "$SOURCE_DATE_EPOCH" | wc -l)" -eq 1
          python3 scripts/package_linux_release.py --tag "$TAG" --print-prerelease >/dev/null
          test -f "$NOTES"
          {
            printf 'TAG=%s\n' "$TAG"
            printf 'VERSION=%s\n' "$VERSION"
            printf 'NOTES=%s\n' "$NOTES"
            printf 'TITLE=%s\n' "$TITLE"
            printf 'ASSET=%s\n' "$ASSET"
            printf 'RELEASE_COMMIT=%s\n' "$RELEASE_COMMIT"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_ENV"

      - name: Test release packaging contract
        run: cargo test --locked --all-features --test release_packaging_tests

      - name: Build Linux release binaries
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin rustscript-agent --bin rustscript-agent-gateway

      - name: Package deterministic Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/package_linux_release.py \
            --tag "$TAG" \
            --binary-dir target/x86_64-unknown-linux-gnu/release \
            --output-dir dist
          test -f "$ASSET"

      - name: Verify and extract release archive
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          python3 scripts/package_linux_release.py \
            --verify-archive "$ASSET" \
            --tag "$TAG" \
            --binary-dir target/x86_64-unknown-linux-gnu/release \
            --forbid-byte-string "$GITHUB_WORKSPACE"
          tar -xzf "$ASSET" -C "$extract_dir"
          root="$extract_dir/rustscript-agent-${TAG}-x86_64-unknown-linux-gnu"
          test -x "$root/bin/rustscript-agent"
          test -x "$root/bin/rustscript-agent-gateway"
          test -d "$root/share/rustscript-agent/rss"
          test -d "$root/share/rustscript-agent/schemas"
          test -d "$root/share/rustscript-agent/examples"
          test -f "$root/MANIFEST.txt"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          verify_remote_tag() {
            local remote_refs tag_oid peeled_oid remote_commit
            remote_refs="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
            tag_oid=""
            peeled_oid=""
            while read -r oid ref; do
              if [[ "$ref" == "refs/tags/${TAG}" ]]; then
                tag_oid="$oid"
              elif [[ "$ref" == "refs/tags/${TAG}^{}" ]]; then
                peeled_oid="$oid"
              fi
            done <<< "$remote_refs"
            test -n "$tag_oid"
            remote_commit="${peeled_oid:-$tag_oid}"
            test "$remote_commit" = "$RELEASE_COMMIT"
          }

          PRERELEASE="$(python3 scripts/package_linux_release.py --tag "$TAG" --print-prerelease)"
          verify_remote_tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            verify_remote_tag
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease="$PRERELEASE"
            verify_remote_tag
            gh release upload "$TAG" "$ASSET" --clobber
          else
            verify_remote_tag
            gh release create "$TAG" "$ASSET" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease="$PRERELEASE"
          fi
          verify_remote_tag
