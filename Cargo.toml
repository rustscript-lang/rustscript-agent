[package]
name = "rustscript-agent"
version = "0.1.0"
edition = "2024"
description = "Standalone script-owned RustScript agent runner and Hermes-compatible gateway"
license = "MIT"

[lib]
name = "rustscript_agent"

[[bin]]
name = "rustscript-agent"
path = "src/bin/rustscript-agent.rs"

[[bin]]
name = "rustscript-agent-gateway"
path = "src/bin/rustscript-agent-gateway.rs"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustscript-vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript.git", rev = "5c328b8d5c374b365a2560925204e588b575a30a", default-features = false, features = ["runtime", "http-client", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tracing-core = "0.1"
